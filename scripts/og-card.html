<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  html,body{margin:0}
  @font-face{font-family:Geist;src:url(../fonts/Geist-Variable.woff2) format('woff2');font-weight:100 900}
  @font-face{font-family:'Geist Mono';src:url(../fonts/GeistMono-Variable.woff2) format('woff2');font-weight:100 900}
  body{width:1200px;height:630px;background:#111;color:#eee;font-family:Geist,sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:72px 80px;box-sizing:border-box}
  .top{display:flex;align-items:center;gap:16px;font:24px 'Geist Mono',monospace;color:#7b7b7b}
  .mark{width:52px;height:52px;border-radius:10px;background:#191919;border:1px solid #ffffff2c;color:#eee;font-family:Geist;display:grid;place-items:center;font-weight:600;font-size:21px}
  h1{font-size:76px;margin:0 0 14px;letter-spacing:-1.5px;font-weight:600}
  p{font:28px 'Geist Mono',monospace;margin:0;color:#7b7b7b;line-height:1.35}
  .row{display:flex;border:1px solid #ffffff1b;border-radius:10px;overflow:hidden;background:#191919}
  .row div{flex:1;padding:20px 26px;font:18px 'Geist Mono',monospace;color:#7b7b7b}
  .row div+div{border-left:1px solid #ffffff1b}
  .row b{display:block;font:600 34px Geist;color:#eee;margin-bottom:4px}
</style></head><body>
  <div class="top"><span class="mark">JG</span><span style="width:10px;height:10px;border-radius:50%;background:#3dd68c"></span>jaswanthnani02.github.io</div>
  <div><h1>Jaswanth Gaddam</h1><p>Cloud and AI Solutions Engineer · Chicago</p></div>
  <div class="row"><div><b>100,000+</b>tickets auto-assigned</div><div><b>10 min</b>onboarding, was 5 days</div><div><b>~35</b>LLM tools, role-checked</div></div>
</body></html>
